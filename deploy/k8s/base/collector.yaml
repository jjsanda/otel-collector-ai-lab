apiVersion: v1
kind: ConfigMap
metadata:
  name: collector-config
  labels:
    app.kubernetes.io/name: collector
data:
  collector.yaml: |
    # Self-contained k8s pipeline: no external backends required, so a kind
    # smoke test works out of the box. Traces are sanitized + turned into
    # metrics, which are exposed for Prometheus scraping.
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      genaievents:
        endpoint: 0.0.0.0:8099
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 256
        spike_limit_mib: 64
      batch:
        timeout: 2s
      genairedaction:
        mode: mask
        normalize_provider: true
        environment: kind
    connectors:
      genaimetrics: {}
    exporters:
      debug:
        verbosity: normal
      prometheus:
        endpoint: 0.0.0.0:8889
        resource_to_telemetry_conversion:
          enabled: true
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp, genaievents]
          processors: [memory_limiter, genairedaction, batch]
          exporters: [genaimetrics, debug]
        metrics:
          receivers: [otlp, genaimetrics]
          processors: [memory_limiter, batch]
          exporters: [prometheus, debug]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, genairedaction, batch]
          exporters: [debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  labels:
    app.kubernetes.io/name: collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: collector
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8889"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: otel-genai/collector:latest
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/otelcol/collector.yaml"]
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: prom, containerPort: 8889 }
            - { name: genaievents, containerPort: 8099 }
            - { name: health, containerPort: 13133 }
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
          livenessProbe:
            httpGet: { path: /, port: 13133 }
            initialDelaySeconds: 5
          readinessProbe:
            httpGet: { path: /, port: 13133 }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: config
          configMap:
            name: collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: collector
  labels:
    app.kubernetes.io/name: collector
spec:
  selector:
    app.kubernetes.io/name: collector
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
    - { name: prom, port: 8889, targetPort: 8889 }
    - { name: genaievents, port: 8099, targetPort: 8099 }
    - { name: health, port: 13133, targetPort: 13133 }
