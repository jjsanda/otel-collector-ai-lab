          type: RuntimeDefault
      containers:
        - name: worker
          image: otel-genai/worker:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports: [{ containerPort: 8081 }]
          env:
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://collector:4318" }
            - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: "http/protobuf" }
            - { name: OTEL_SERVICE_NAME, value: "worker" }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: "deployment.environment=kind" }
            - { name: DB_ADAPTER_URL, value: "http://db-adapter:8082" }
