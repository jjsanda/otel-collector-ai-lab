receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  genaievents:
    endpoint: 0.0.0.0:8099
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 2s
  genairedaction:
    mode: mask
    normalize_provider: true
    environment: helm
connectors:
  genaimetrics: {}
exporters:
  debug:
    verbosity: normal
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp, genaievents]
      processors: [memory_limiter, genairedaction, batch]
      exporters: [genaimetrics, debug]
    metrics:
      receivers: [otlp, genaimetrics]
      processors: [memory_limiter, batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, genairedaction, batch]
      exporters: [debug]
