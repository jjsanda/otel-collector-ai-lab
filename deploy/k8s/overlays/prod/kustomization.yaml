apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# A "prod-like" overlay: separate namespace, scaled-out stateless services, and
# tighter collector resources. Demonstrates environment-specific overlays.
namespace: otel-genai-prod

resources:
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/part-of: otel-genai-lab
      app.kubernetes.io/managed-by: kustomize

images:
  - { name: otel-genai/collector, newTag: latest }
  - { name: otel-genai/api, newTag: latest }
  - { name: otel-genai/worker, newTag: latest }
  - { name: otel-genai/db-adapter, newTag: latest }
  - { name: otel-genai/llm-simulator, newTag: latest }

patches:
  - target: { kind: Deployment, name: api }
    patch: |
      - { op: replace, path: /spec/replicas, value: 2 }
  - target: { kind: Deployment, name: worker }
    patch: |
      - { op: replace, path: /spec/replicas, value: 2 }
  - target: { kind: Deployment, name: collector }
    patch: |
      - { op: replace, path: /spec/template/spec/containers/0/resources/limits/memory, value: 512Mi }
