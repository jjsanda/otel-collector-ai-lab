# Runtime smoke config: exercises all three custom components with no external
# backends. genaievents (receiver) -> genairedaction (processor) ->
# genaimetrics (connector) + debug; metrics -> debug.
receivers:
  genaievents:
    endpoint: 127.0.0.1:8099
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

processors:
  genairedaction:
    mode: mask

connectors:
  genaimetrics: {}

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [genaievents, otlp]
      processors: [genairedaction]
      exporters: [genaimetrics, debug]
    metrics:
      receivers: [genaimetrics]
      exporters: [debug]
